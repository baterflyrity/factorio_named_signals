[mod-name]
named-signals=Named Signals

[mod-description]
named-signals=A decider combinator that tells apart signals from different objects on the same wire. Name a chest or a belt, and conditions can read values only from that source or a group of sources with the same name. Supports R/G wire selection, AND/OR conditions, blueprints and settings copy-paste.

[entity-name]
ns-relay-mast=Relay pole
ns-relay-pole=Relay pole
ns-relay-pole-input=Relay pole (input)
ns-decider-combinator=Named decider combinator
ns-decider-output=Named decider combinator output (internal)

[entity-description]
ns-relay-mast=A medium electric pole with a built-in power switch: supplies a 7×7 area only while on. Does not auto-connect — run a copper wire to its input manually. Controlled like a power switch: manually or by a circuit signal.
ns-decider-combinator=Like a decider combinator, but conditions can reference a named source: a chest or a belt (in Hold mode).

[item-name]
ns-relay-pole=Relay pole
ns-decider-combinator=Named decider combinator

[recipe-name]
ns-relay-pole=Relay pole
ns-decider-combinator=Named decider combinator

[mod-setting-name]
ns-update-interval=Combinator update period, ticks
ns-topology-interval=Wire rescan period, ticks

[mod-setting-description]
ns-update-interval=1 = every tick, like vanilla combinators. Higher = less load, more latency.
ns-topology-interval=How often to check which named sources are connected to combinators.
