[entity-description]
ns-relay-mast=Средняя опора ЛЭП с выключателем: питает зону 7×7, только когда включена. Сама к сети не подключается — проложите медный провод на вход вручную. Управляется как выключатель питания: вручную или сигналом.
ns-decider-combinator=Как сравнивающий комбинатор, но в условиях можно указать имя источника — сундука или конвейера (в режиме «Удержание»).

