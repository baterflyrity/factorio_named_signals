[mod-setting-name]
ns-update-interval=Период обновления комбинаторов, тиков
ns-topology-interval=Период пересканирования проводов, тиков

[mod-setting-description]
ns-update-interval=1 — каждый тик, как у ванильных комбинаторов. Больше — меньше нагрузка, но выше задержка.
ns-topology-interval=Как часто проверять, какие именованные источники подключены к комбинаторам.
