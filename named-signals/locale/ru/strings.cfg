[mod-name]
named-signals=Именованные сигналы

[mod-description]
named-signals=Сравнивающий комбинатор, который различает сигналы от разных объектов на одном проводе. Дайте имя сундуку, конвейеру, резервуару, манипулятору или аккумулятору — и берите в условиях значение только от него или от группы с одинаковым именем (сумма, минимум, максимум, среднее, количество). Сигналы «каждый», «любой», «все», провода R/G, значения прямо в окне. Плюс ЛЭП-реле: средняя опора ЛЭП, которая питает зону, только когда включена. Исходный код, описание и примеры схем: https://github.com/baterflyrity/factorio_named_signals

[entity-name]
ns-relay-mast=ЛЭП-реле
ns-relay-pole=ЛЭП-реле
ns-relay-pole-input=ЛЭП-реле (вход)
ns-decider-combinator=Сравнивающий комбинатор с именами
ns-decider-output=Выход комбинатора с именами (служебный)

[entity-description]
ns-relay-mast=Средняя опора ЛЭП с выключателем: питает зону 7×7, только когда включена. Сама к сети не подключается — проложите медный провод на вход вручную. Управляется как выключатель питания: вручную или сигналом.
ns-decider-combinator=Как сравнивающий комбинатор, но в условиях можно указать имя источника — сундука или конвейера (в режиме «Непрерывно»).

[item-name]
ns-relay-pole=ЛЭП-реле
ns-decider-combinator=Сравнивающий комбинатор с именами

[recipe-name]
ns-relay-pole=ЛЭП-реле
ns-decider-combinator=Сравнивающий комбинатор с именами

[mod-setting-name]
ns-update-interval=Период обновления комбинаторов, тиков
ns-topology-interval=Период пересканирования проводов, тиков

[mod-setting-description]
ns-update-interval=1 — каждый тик, как у ванильных комбинаторов. Больше — меньше нагрузка, но выше задержка.
ns-topology-interval=Как часто проверять, какие именованные источники подключены к комбинаторам.
