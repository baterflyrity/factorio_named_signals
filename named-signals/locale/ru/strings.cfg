[mod-name]
named-signals=Именованные сигналы

[mod-description]
named-signals=Сравнивающий комбинатор, который различает сигналы от разных объектов на одном проводе. Дайте сундуку или конвейеру имя, и в условиях можно брать значение только от этого источника или группы источников с одинаковым именем. Поддерживаются провода R/G, условия И/ИЛИ, чертежи и копирование настроек.

